<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Portal — Full 38-Column Payroll & Compensation Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#f5f5f7;--bg-elev:#fff;--cd:rgba(255,255,255,.72);--cd-solid:#fff;
  --tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.07);--bd-strong:rgba(0,0,0,.12);
  --ac:#0071e3;--ac2:#0077ed;--ac-soft:rgba(0,113,227,.10);
  --ok:#30b14b;--ok-soft:rgba(48,177,75,.10);
  --no:#ff3b30;--no-soft:rgba(255,59,48,.10);
  --wa:#ff9500;--wa-soft:rgba(255,149,0,.10);
  --sh-sm:0 1px 2px rgba(0,0,0,.04);--sh:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
  --sh-lg:0 4px 16px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.10);
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;
    --tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);
    --ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);
    --ok:#30d158;--ok-soft:rgba(48,209,88,.16);
    --no:#ff453a;--no-soft:rgba(255,69,58,.16);
    --wa:#ff9f0a;--wa-soft:rgba(255,159,10,.16);
    --sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
    --sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

/* ===== LAYOUT ===== */
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;background:var(--bg)}
aside{background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:1px solid var(--bd);padding:20px 14px 20px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
aside::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-size:16px;font-weight:700;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;box-shadow:0 4px 12px rgba(10,132,255,.35)}

.ni{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:9px 12px;
  border-radius:10px;color:var(--tx);font-weight:500;width:100%;font-size:13.5px;transition:background .18s,color .18s;cursor:pointer}
.ni i{font-size:18px}.ni:hover{background:var(--ac-soft)}.ni.on{background:var(--ac-soft);color:var(--ac);font-weight:600}
.sl{font-size:11px;color:var(--mu);font-weight:700;padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.06em}

section{background:var(--bg);min-width:0;display:flex;flex-direction:column}
main{padding:20px 32px 40px;flex:1;width:100%;max-width:1400px;margin:0 auto}

/* ===== TOPBAR ===== */
.top{position:fixed;top:0;left:270px;right:0;z-index:50;padding:12px 32px;
  background:rgba(245,245,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);pointer-events:none}
.topbar{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:var(--sh-sm);max-width:1100px;margin:0 auto}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08)}}
.tb-title{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:6px}
.tb-btn{height:36px;padding:0 14px;border-radius:10px;border:0;background:rgba(120,120,128,.08);
  color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{background:rgba(120,120,128,.16)}.tb-btn i{font-size:16px}
.tb-btn.p{background:var(--ac);color:#fff}.tb-btn.p:hover{background:var(--ac2)}

/* ===== CARDS & TABLES ===== */
.cd{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd{background:var(--bg-elev)}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.g .cd{margin:0}

.st{border-top:0;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--ac));border-radius:var(--r-lg) var(--r-lg) 0 0}
.st b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.st .lbl{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}

/* STICKY FULL TABLE WITH 38 COLUMNS */
.tw{overflow-x:auto;max-width:100%;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh-sm);background:var(--cd-solid);margin:16px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);white-space:nowrap;transition:background .2s}
th{color:#fff;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  background:var(--ac);position:sticky;top:0;z-index:10;text-align:center}

/* Sticky first 2 columns */
th:nth-child(1), td:nth-child(1){position:sticky;left:0;z-index:11;background:var(--cd-solid)}
th:nth-child(2), td:nth-child(2){position:sticky;left:65px;z-index:11;background:var(--cd-solid)}
th:nth-child(1), th:nth-child(2){background:var(--ac);z-index:12}

td{text-align:center}td:first-child,th:first-child{text-align:left}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
tbody tr:hover td{background:var(--ac-soft) !important}

.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd-solid);border:1px solid var(--bd-strong);
  border-radius:var(--r-sm);padding:9px 12px;width:100%}

.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:700}
.tag-blue{background:var(--ac-soft);color:var(--ac)}.tag-green{background:var(--ok-soft);color:var(--ok)}
.tag-orange{background:var(--wa-soft);color:var(--wa)}.tag-red{background:var(--no-soft);color:var(--no)}
.tag-gray{background:rgba(120,120,128,.12);color:var(--mu)}

.callout{display:flex;gap:12px;padding:14px 18px;border-radius:var(--r);margin:16px 0;font-size:13px}
.callout-info{background:var(--ac-soft);border:1px solid color-mix(in srgb,var(--ac) 20%,transparent)}
.callout-warning{background:var(--wa-soft);border:1px solid color-mix(in srgb,var(--wa) 20%,transparent)}

.code-block{background:#1e1e2e;color:#cdd6f4;border-radius:var(--r);padding:18px 20px;margin:16px 0;
  font-family:var(--font-mono);font-size:12px;line-height:1.7;overflow-x:auto}
.pg-h{margin-bottom:20px}.pg-h h1{font-size:26px;font-weight:800;margin:0 0 4px}.pg-h p{color:var(--mu);margin:0;font-size:13.5px}
.sec-title{display:flex;align-items:center;gap:10px;margin:24px 0 14px;font-size:17px;font-weight:700}
.sec-title::before{content:"";width:4px;height:1.1em;background:var(--ac);border-radius:4px}
.hide{display:none !important}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-xl);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-card .close{float:right;background:transparent;border:0;font-size:20px;color:var(--mu);cursor:pointer}

@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.top{left:0}main{padding:70px 16px 40px}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand">
      <div class="logo">HR</div>
      <div>
        <div style="font-weight:800;font-size:15px">HR Portal</div>
        <div style="font-size:11px;color:var(--mu)">mPayRoll PRO V5.5</div>
      </div>
    </div>

    <div class="sl">Cẩm nang Luật &amp; Thuế 2026</div>
    <button class="ni" data-page="legal_61" onclick="nav('legal_61')"><i class="ti ti-book"></i> 61 Khoản Thu Nhập &amp; BHXH</button>
    <button class="ni" data-page="pay_scales_2026" onclick="nav('pay_scales_2026')"><i class="ti ti-table-alias"></i> Thang Bảng Lương 2026</button>

    <div class="sl">Bảng Lương Full 38 Cột (Excel Image)</div>
    <button class="ni" data-page="payroll_v55" onclick="nav('payroll_v55')"><i class="ti ti-report-money"></i> Bảng Lương Full 38 Cột (24 NV)</button>
    <button class="ni" data-page="formula_system" onclick="nav('formula_system')"><i class="ti ti-math-symbols"></i> 13 Công Thức Lương Động</button>

    <div class="sl">Tổng quan &amp; Cấu trúc</div>
    <button class="ni" data-page="overview" onclick="nav('overview')"><i class="ti ti-layout-dashboard"></i> Tổng quan System</button>
    <button class="ni" data-page="components" onclick="nav('components')"><i class="ti ti-coins"></i> Salary Components</button>
    <button class="ni" data-page="structures" onclick="nav('structures')"><i class="ti ti-template"></i> Salary Structures</button>
    <button class="ni" data-page="grades" onclick="nav('grades')"><i class="ti ti-chart-dots-3"></i> Salary Grades</button>

    <div class="sl">Vận hành &amp; Governance</div>
    <button class="ni" data-page="payroll" onclick="nav('payroll')"><i class="ti ti-cash"></i> Payroll Engine</button>
    <button class="ni" data-page="hr_portal_spec" onclick="nav('hr_portal_spec')"><i class="ti ti-adjustments-horizontal"></i> HR Portal Specs &amp; RLS</button>
    <button class="ni" data-page="sql" onclick="nav('sql')"><i class="ti ti-database"></i> SQL Blueprint</button>
  </aside>

  <section>
    <div class="top no-print">
      <div class="topbar">
        <div class="tb-title" id="pageTitle">HR Portal — Compensation &amp; Payroll</div>
        <div class="tb-actions">
          <button class="tb-btn" onclick="exportCurrentData()" title="Export JSON"><i class="ti ti-download"></i> Export</button>
          <button class="tb-btn p" onclick="showModal('calcModal')"><i class="ti ti-calculator"></i> Gross → Net</button>
        </div>
      </div>
    </div>
    <main id="main">Loading...</main>
  </section>
</div>

<!-- CALCULATOR MODAL -->
<div id="calcModal" class="modal hide" onclick="if(event.target===this)closeModal('calcModal')">
  <div class="modal-card">
    <button class="close" onclick="closeModal('calcModal')"><i class="ti ti-x"></i></button>
    <h3><i class="ti ti-calculator" style="color:var(--ac)"></i> Tính thử Gross → Net 2026</h3>
    <div class="f" style="margin-top:16px">
      <label>Lương Gross (VNĐ)<input type="number" id="calcGross" value="20000000" oninput="runCalc()"></label>
      <label>Vùng lương tối thiểu
        <select id="calcRegion" onchange="runCalc()">
          <option value="1">Vùng I: 5.310.000đ (2026)</option>
          <option value="2">Vùng II: 4.730.000đ</option>
        </select>
      </label>
      <label>Bảo hiểm (VNĐ)<input type="number" id="calcIns" value="20000000" oninput="runCalc()"></label>
      <label>Người phụ thuộc<input type="number" id="calcDeps" value="0" oninput="runCalc()"></label>
    </div>
    <div id="calcResult" style="margin-top:16px"></div>
  </div>
</div>

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vnd = n => Math.round(Number(n) || 0).toLocaleString('vi-VN') + ' ₫';

function showModal(id) { document.getElementById(id).classList.remove('hide'); }
function closeModal(id) { document.getElementById(id).classList.add('hide'); }

function calculateTax(taxableIncome) {
  let remaining = Math.max(0, taxableIncome);
  let tax = 0;
  const brackets = [
    { limit: 5000000, rate: 0.05 },
    { limit: 5000000, rate: 0.10 },
    { limit: 8000000, rate: 0.15 },
    { limit: 14000000, rate: 0.20 },
    { limit: 20000000, rate: 0.25 },
    { limit: 28000000, rate: 0.30 },
    { limit: Infinity, rate: 0.35 }
  ];
  for (const b of brackets) {
    const taxable = Math.min(remaining, b.limit);
    tax += taxable * b.rate;
    remaining -= taxable;
    if (remaining <= 0) break;
  }
  return Math.round(tax);
}

function runCalc() {
  const gross = +document.getElementById('calcGross').value || 0;
  const insBase = +document.getElementById('calcIns').value || gross;
  const deps = +document.getElementById('calcDeps').value || 0;
  const cap = 5310000 * 20; 
  const base = Math.min(insBase, cap);
  const bhxh = Math.round(base * 0.08);
  const bhyt = Math.round(base * 0.015);
  const bhtn = Math.round(base * 0.01);
  const taxable = gross - bhxh - bhyt - bhtn - 15500000 - deps * 6200000;
  const tax = calculateTax(Math.max(0, taxable));
  const net = gross - bhxh - bhyt - bhtn - tax;
  document.getElementById('calcResult').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><div style="color:var(--mu);font-size:11px">Gross</div><div style="font-size:16px;font-weight:700">${vnd(gross)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">BHXH (8%)</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(bhxh)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">BHYT (1.5%)</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(bhyt)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">BHTN (1%)</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(bhtn)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">Thuế TNCN</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(tax)}</div></div>
      <div style="background:var(--ok-soft);padding:10px;border-radius:var(--r-sm)">
        <div style="color:var(--mu);font-size:11px">THỰC NHẬN</div>
        <div style="font-size:18px;font-weight:800;color:var(--ok)">${vnd(net)}</div>
      </div>
    </div>`;
}
