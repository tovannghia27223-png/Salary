<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Portal — Adaptive Payroll Engine for All Enterprise Types</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#f5f5f7;--bg-elev:#fff;--cd:rgba(255,255,255,.72);--cd-solid:#fff;
  --tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.07);--bd-strong:rgba(0,0,0,.12);
  --ac:#0071e3;--ac2:#0077ed;--ac-soft:rgba(0,113,227,.10);
  --ok:#30b14b;--ok-soft:rgba(48,177,75,.10);
  --no:#ff3b30;--no-soft:rgba(255,59,48,.10);
  --wa:#ff9500;--wa-soft:rgba(255,149,0,.10);
  --sh-sm:0 1px 2px rgba(0,0,0,.04);--sh:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
  --sh-lg:0 4px 16px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.10);
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;
    --tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);
    --ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);
    --ok:#30d158;--ok-soft:rgba(48,209,88,.16);
    --no:#ff453a;--no-soft:rgba(255,69,58,.16);
    --wa:#ff9f0a;--wa-soft:rgba(255,159,10,.16);
    --sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
    --sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;background:var(--bg)}
aside{background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:1px solid var(--bd);padding:20px 14px 20px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
aside::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-size:16px;font-weight:700;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;box-shadow:0 4px 12px rgba(10,132,255,.35)}

.ni{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:9px 12px;
  border-radius:10px;color:var(--tx);font-weight:500;width:100%;font-size:13.5px;transition:background .18s,color .18s;cursor:pointer}
.ni i{font-size:18px}.ni:hover{background:var(--ac-soft)}.ni.on{background:var(--ac-soft);color:var(--ac);font-weight:600}
.sl{font-size:11px;color:var(--mu);font-weight:700;padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.06em}

section{background:var(--bg);min-width:0;display:flex;flex-direction:column}
main{padding:20px 32px 40px;flex:1;width:100%;max-width:1400px;margin:0 auto}

.top{position:fixed;top:0;left:270px;right:0;z-index:50;padding:12px 32px;
  background:rgba(245,245,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);pointer-events:none}
.topbar{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:var(--sh-sm);max-width:1100px;margin:0 auto}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08)}}
.tb-title{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:6px}
.tb-btn{height:36px;padding:0 14px;border-radius:10px;border:0;background:rgba(120,120,128,.08);
  color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{background:rgba(120,120,128,.16)}.tb-btn i{font-size:16px}
.tb-btn.p{background:var(--ac);color:#fff}.tb-btn.p:hover{background:var(--ac2)}

.cd{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd{background:var(--bg-elev)}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.g .cd{margin:0}

.st{border-top:0;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--ac));border-radius:var(--r-lg) var(--r-lg) 0 0}
.st b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.st .lbl{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}

.tw{overflow-x:auto;max-width:100%;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh-sm);background:var(--cd-solid);margin:16px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);white-space:nowrap;transition:background .2s}
th{color:#fff;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  background:var(--ac);position:sticky;top:0;z-index:10;text-align:center}

th:nth-child(1), td:nth-child(1){position:sticky;left:0;z-index:11;background:var(--cd-solid)}
th:nth-child(2), td:nth-child(2){position:sticky;left:65px;z-index:11;background:var(--cd-solid)}
th:nth-child(1), th:nth-child(2){background:var(--ac);z-index:12}

td{text-align:center}td:first-child,th:first-child{text-align:left}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
tbody tr:hover td{background:var(--ac-soft) !important}

.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd-solid);border:1px solid var(--bd-strong);
  border-radius:var(--r-sm);padding:9px 12px;width:100%}

.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:700}
.tag-blue{background:var(--ac-soft);color:var(--ac)}.tag-green{background:var(--ok-soft);color:var(--ok)}
.tag-orange{background:var(--wa-soft);color:var(--wa)}.tag-red{background:var(--no-soft);color:var(--no)}
.tag-gray{background:rgba(120,120,128,.12);color:var(--mu)}

.callout{display:flex;gap:12px;padding:14px 18px;border-radius:var(--r);margin:16px 0;font-size:13px}
.callout-info{background:var(--ac-soft);border:1px solid color-mix(in srgb,var(--ac) 20%,transparent)}
.callout-warning{background:var(--wa-soft);border:1px solid color-mix(in srgb,var(--wa) 20%,transparent)}

.code-block{background:#1e1e2e;color:#cdd6f4;border-radius:var(--r);padding:18px 20px;margin:16px 0;
  font-family:var(--font-mono);font-size:12px;line-height:1.7;overflow-x:auto}
.pg-h{margin-bottom:20px}.pg-h h1{font-size:26px;font-weight:800;margin:0 0 4px}.pg-h p{color:var(--mu);margin:0;font-size:13.5px}
.sec-title{display:flex;align-items:center;gap:10px;margin:24px 0 14px;font-size:17px;font-weight:700}
.sec-title::before{content:"";width:4px;height:1.1em;background:var(--ac);border-radius:4px}
.hide{display:none !important}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-xl);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-card .close{float:right;background:transparent;border:0;font-size:20px;color:var(--mu);cursor:pointer}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap input{padding-left:36px}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:16px}
.col-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.col-toggle label{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(120,120,128,.08);cursor:pointer}
.col-toggle input{width:auto;margin:0}

@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.top{left:0}main{padding:70px 16px 40px}}

@media print{
  .no-print, aside, .top, .toolbar, .col-toggle, .modal{display:none !important}
  .app{grid-template-columns:1fr}
  main{padding:0;max-width:100%}
  .cd{box-shadow:none;border:1px solid #ddd}
  .tw{overflow:visible}
  th{background:#333 !important;color:#fff !important}
  td,th{border-color:#ddd !important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand">
      <div class="logo">HR</div>
      <div>
        <div style="font-weight:800;font-size:15px">HR Portal</div>
        <div style="font-size:11px;color:var(--mu)">Adaptive Payroll Engine</div>
      </div>
    </div>

    <div class="sl">Doanh nghiệp</div>
    <div style="padding:0 10px 10px">
      <select id="companyProfile" onchange="changeProfile()" style="font-size:13px;padding:8px 10px">
        <option value="fdi">FDI / Liên doanh</option>
        <option value="state">Doanh nghiệp Nhà nước</option>
        <option value="private">Doanh nghiệp Tư nhân</option>
        <option value="startup">Startup / Công nghệ</option>
      </select>
      <div id="profileDesc" style="font-size:12px;color:var(--mu);margin-top:6px;line-height:1.4"></div>
    </div>

    <div class="sl">Cẩm nang Luật &amp; Thuế 2026</div>
    <button class="ni" data-page="legal_61" onclick="nav('legal_61')"><i class="ti ti-book"></i> 61 Khoản Thu Nhập &amp; BHXH</button>
    <button class="ni" data-page="pay_scales_2026" onclick="nav('pay_scales_2026')"><i class="ti ti-table-alias"></i> Thang Bảng Lương 2026</button>

    <div class="sl">Bảng Lương Full 38 Cột</div>
    <button class="ni" data-page="payroll_v55" onclick="nav('payroll_v55')"><i class="ti ti-report-money"></i> Bảng Lương Full 38 Cột (24 NV)</button>
    <button class="ni" data-page="formula_system" onclick="nav('formula_system')"><i class="ti ti-math-symbols"></i> Công Thức Lương Động</button>

    <div class="sl">Tổng quan &amp; Cấu trúc</div>
    <button class="ni" data-page="overview" onclick="nav('overview')"><i class="ti ti-layout-dashboard"></i> Tổng quan System</button>
    <button class="ni" data-page="components" onclick="nav('components')"><i class="ti ti-coins"></i> Salary Components</button>
    <button class="ni" data-page="structures" onclick="nav('structures')"><i class="ti ti-template"></i> Salary Structures</button>
    <button class="ni" data-page="grades" onclick="nav('grades')"><i class="ti ti-chart-dots-3"></i> Salary Grades</button>

    <div class="sl">Vận hành &amp; Governance</div>
    <button class="ni" data-page="payroll" onclick="nav('payroll')"><i class="ti ti-cash"></i> Payroll Engine</button>
    <button class="ni" data-page="hr_portal_spec" onclick="nav('hr_portal_spec')"><i class="ti ti-adjustments-horizontal"></i> HR Portal Specs &amp; RLS</button>
    <button class="ni" data-page="sql" onclick="nav('sql')"><i class="ti ti-database"></i> SQL Blueprint</button>
  </aside>

  <section>
    <div class="top no-print">
      <div class="topbar">
        <div class="tb-title" id="pageTitle">HR Portal — Compensation &amp; Payroll</div>
        <div class="tb-actions">
          <button class="tb-btn" onclick="importJSON()" title="Import JSON"><i class="ti ti-upload"></i> Import</button>
          <button class="tb-btn" onclick="exportCurrentData()" title="Export JSON"><i class="ti ti-download"></i> Export</button>
          <button class="tb-btn p" onclick="showModal('calcModal')"><i class="ti ti-calculator"></i> Gross → Net</button>
        </div>
      </div>
    </div>
    <main id="main">Loading...</main>
  </section>
</div>

<input type="file" id="importFile" class="hide" accept=".json" onchange="handleImport(event)">

<!-- CALCULATOR MODAL -->
<div id="calcModal" class="modal hide" onclick="if(event.target===this)closeModal('calcModal')">
  <div class="modal-card">
    <button class="close" onclick="closeModal('calcModal')"><i class="ti ti-x"></i></button>
    <h3><i class="ti ti-calculator" style="color:var(--ac)"></i> Tính thử Gross → Net 2026</h3>
    <div class="f" style="margin-top:16px">
      <label>Lương Gross (VNĐ)<input type="number" id="calcGross" value="20000000" oninput="runCalc()"></label>
      <label>Vùng lương tối thiểu
        <select id="calcRegion" onchange="runCalc()">
          <option value="1">Vùng I: 5.310.000đ (2026)</option>
          <option value="2">Vùng II: 4.730.000đ</option>
          <option value="3">Vùng III: 4.150.000đ</option>
          <option value="4">Vùng IV: 3.720.000đ</option>
        </select>
      </label>
      <label>Bảo hiểm (VNĐ)<input type="number" id="calcIns" value="20000000" oninput="runCalc()"></label>
      <label>Người phụ thuộc<input type="number" id="calcDeps" value="0" oninput="runCalc()"></label>
    </div>
    <div id="calcResult" style="margin-top:16px"></div>
  </div>
</div>

<script>
// ============================================================
// COMPANY PROFILES — Adaptive by Enterprise Type
// ============================================================
const COMPANY_PROFILES = {
  fdi: {
    name: "FDI / Liên doanh",
    desc: "Thang lương thị trường, đầy đủ phụ cấp, KPI, thưởng doanh số, có công đoàn, bảo hiểm bổ sung có thể có.",
    minWageRegion: 1,
    hasUnion: true,
    hasESOP: false,
    salaryType: "market",
    insuranceCapMultiplier: 20,
    visibleColumns: ["pcCv","pcTn","pcBh1","pcBh2","pcBh3","cc","kpi","sp","ds","tnKhac","tnMien","dem","ot","bhxhNld","bhytNld","bhtnNld","tongBhNld","tnChiuThue","gtBT","npt","gtNpt","tnTinhThue","thue","net","bhxhDn","bhytDn","bhtnDn","tnldDn","kpcdDn","tongBhDn","tongCP","checkCp","anCa","anCaMien","anCaChiu","checkAnCa","tranBH","tranBHTN","trangThai","congThucTe","anCaTheoMuc","pcXang","pcDT"],

    payScales: "market",
    stateScale: false,
    notes: "Phù hợp với các khoản phụ cấp xăng xe, điện thoại, ăn ca. Có thể có bảo hiểm bổ sung (pcBh1-3)."
  },
  state: {
    name: "Doanh nghiệp Nhà nước",
    desc: "Dùng hệ số lương Nhà nước, có quỹ phúc lợi, công đoàn bắt buộc, không có ESOP, phụ cấp theo chức danh quy định.",
    minWageRegion: 1,
    hasUnion: true,
    hasESOP: false,
    salaryType: "state_scale",
    insuranceCapMultiplier: 20,
    visibleColumns: ["heSo","luongCoSo","pcCv","pcTn","thamNien","cc","kpi","tnKhac","tnMien","bhxhNld","bhytNld","bhtnNld","tongBhNld","tnChiuThue","gtBT","npt","gtNpt","tnTinhThue","thue","net","bhxhDn","bhytDn","bhtnDn","tnldDn","kpcdDn","tongBhDn","tongCP","checkCp","anCa","anCaMien","checkAnCa","tranBH","tranBHTN","trangThai","congThucTe","quyPhucLoi"],
    formulas: ["gross_to_net","bhxh_nld","bhyt_nld","bhtn_nld","thue_tncn","thuc_linh","kpcd_dn","bhxh_dn","bhyt_dn","bhtn_dn","tnld_dn","luong_theo_he_so","phat_cham_cong","thuong_chuyen_can"],
    payScales: "state",
    stateScale: true,
    notes: "Lương = Hệ số × Lương cơ sở. Các phụ cấp chức vụ, trách nhiệm, thâm niên theo quy định."
  },
  private: {
    name: "Doanh nghiệp Tư nhân",
    desc: "Linh hoạt nhất: lương khoán, sản phẩm, không bắt buộc công đoàn, thang lương thị trường.",
    minWageRegion: 1,
    hasUnion: false,
    hasESOP: false,
    salaryType: "market",
    insuranceCapMultiplier: 20,
    visibleColumns: ["pcCv","pcTn","cc","kpi","sp","ds","tnKhac","tnMien","dem","ot","bhxhNld","bhytNld","bhtnNld","tongBhNld","tnChiuThue","gtBT","npt","gtNpt","tnTinhThue","thue","net","bhxhDn","bhytDn","bhtnDn","tongBhDn","tongCP","checkCp","anCa","anCaMien","checkAnCa","tranBH","tranBHTN","trangThai","congThucTe","pcXang"],
    formulas: ["gross_to_net","bhxh_nld","bhyt_nld","bhtn_nld","thue_tncn","thuc_linh","bhxh_dn","bhyt_dn","bhtn_dn","luong_cong","phat_cham_cong","thuong_chuyen_can","thuong_doanh_so"],
    payScales: "market",
    stateScale: false,
    notes: "Không có cột KPCĐ (vì không bắt buộc công đoàn). Tập trung lương khoán, sản phẩm, doanh số."
  },
  startup: {
    name: "Startup / Công ngh",
    desc: "Lương cơ bản thấp + thưởng/ESOP, ít phụ cấp, linh hoạt, thường không có công đoàn.",
    minWageRegion: 1,
    hasUnion: false,
    hasESOP: true,
    salaryType: "market",
    insuranceCapMultiplier: 20,
    visibleColumns: ["pcCv","cc","kpi","esop","tnKhac","tnMien","bhxhNld","bhytNld","bhtnNld","tongBhNld","tnChiuThue","gtBT","npt","gtNpt","tnTinhThue","thue","net","bhxhDn","bhytDn","bhtnDn","tongBhDn","tongCP","checkCp","anCa","anCaMien","checkAnCa","tranBH","tranBHTN","trangThai","congThucTe","pcXang","stockOption"],
    formulas: ["gross_to_net","bhxh_nld","bhyt_nld","bhtn_nld","thue_tncn","thuc_linh","bhxh_dn","bhyt_dn","bhtn_dn","luong_cong","esop_calc","thuong_kpi"],
    payScales: "market",

  }
};

// ============================================================
// COLUMN DEFINITIONS (meta)
// ============================================================
const COLUMN_META = {
  code:{label:"Mã NV", sticky:true, width:70},
  name:{label:"Họ và tên", sticky:true, width:140},
  dept:{label:"Bộ phận"},
  pos:{label:"Chức danh"},
  std:{label:"Công chuẩn", num:true},
  act:{label:"Công hưởng", num:true},
  pct:{label:"Tỷ lệ công", fmt:v=>(v*100).toFixed(1)+'%'},
  heSo:{label:"Hệ số lương", num:true},
  luongCoSo:{label:"Lương cơ sở", num:true},
  lcb:{label:"LCB đóng BH", num:true},
  pcCv:{label:"PC chức vụ BH", num:true},
  pcTn:{label:"PC trách nhiệm BH", num:true},
  thamNien:{label:"PC thâm niên", num:true},
  pcBh1:{label:"PC BH 1", num:true},
  pcBh2:{label:"PC BH 2", num:true},
  pcBh3:{label:"PC BH 3", num:true},

function calculateTax(taxableIncome) {
  let remaining = Math.max(0, taxableIncome);
  let tax = 0;
  const brackets = [
    { limit: 5000000, rate: 0.05 },
    { limit: 5000000, rate: 0.10 },
    { limit: 8000000, rate: 0.15 },
    { limit: 14000000, rate: 0.20 },
    { limit: 20000000, rate: 0.25 },
    { limit: 28000000, rate: 0.30 },
    { limit: Infinity, rate: 0.35 }
  ];
  for (const b of brackets) {
    const taxable = Math.min(remaining, b.limit);
    tax += taxable * b.rate;
    remaining -= taxable;
    if (remaining <= 0) break;
  }
  return Math.round(tax);
}

function runCalc() {
  const gross = +document.getElementById('calcGross').value || 0;
  const insBase = +document.getElementById('calcIns').value || gross;
  const deps = +document.getElementById('calcDeps').value || 0;
  const region = +document.getElementById('calcRegion').value || 1;
  const regionWages = {1:5310000, 2:4730000, 3:4150000, 4:3720000};
  const cap = (regionWages[region] || 5310000) * 20;
  const base = Math.min(insBase, cap);
  const bhxh = Math.round(base * 0.08);
  const bhyt = Math.round(base * 0.015);
  const bhtn = Math.round(base * 0.01);
  const taxable = gross - bhxh - bhyt - bhtn - 15500000 - deps * 6200000;
  const tax = calculateTax(Math.max(0, taxable));
  const net = gross - bhxh - bhyt - bhtn - tax;
  document.getElementById('calcResult').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><div style="color:var(--mu);font-size:11px">Gross</div><div style="font-size:16px;font-weight:700">${vnd(gross)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">BHXH (8%)</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(bhxh)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">BHYT (1.5%)</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(bhyt)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">BHTN (1%)</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(bhtn)}</div></div>
      <div><div style="color:var(--mu);font-size:11px">Thuế TNCN</div><div style="font-size:15px;font-weight:600;color:var(--no)">-${vnd(tax)}</div></div>
      <div style="background:var(--ok-soft);padding:10px;border-radius:var(--r-sm)">
        <div style="color:var(--mu);font-size:11px">THỰC NHẬN</div>
        <div style="font-size:18px;font-weight:800;color:var(--ok)">${vnd(net)}</div>
      </div>
    </div>`;
}

// Validation logic for CHECK columns
function validateRow(r, profile) {
  const errors = [];
  const expectedGross = r.lcb + r.pcCv + r.pcTn + r.pcBh1 + r.pcBh2 + r.pcBh3;
  if (Math.abs(expectedGross - r.grossFix) > 10) errors.push('GrossFix mismatch');
  const expectedBhNld = r.bhxhNld + r.bhytNld + r.bhtnNld;
  if (Math.abs(expectedBhNld - r.tongBhNld) > 10) errors.push('BH_NLD mismatch');
  const expectedNet = r.tnChiuThue - r.tongBhNld - r.thue;
  if (Math.abs(expectedNet - r.net) > 10) errors.push('Net mismatch');
  if (profile.hasUnion && r.kpcdDn === 0) errors.push('Missing KPCĐ');
  if (!profile.hasUnion && r.kpcdDn > 0) errors.push('Unexpected KPCĐ');
  return errors;
}

function renderPayrollTable() {
  const p = getProfile();
  const visible = p.visibleColumns.filter(c => STATE.colVisibility[c] !== false);
  const rows = STATE.payrollV55Full.filter(r => {
    const s = STATE.search.toLowerCase();
    const match = !s || r.name.toLowerCase().includes(s) || r.code.toLowerCase().includes(s) || r.dept.toLowerCase().includes(s);
    const dept = !STATE.deptFilter || r.dept === STATE.deptFilter;
    return match && dept;
  });

  const depts = [...new Set(STATE.payrollV55Full.map(r=>r.dept))];

  const totalGross = rows.reduce((s, r) => s + r.grossFix, 0);
  const totalNet = rows.reduce((s, r) => s + r.net, 0);
  const totalBhDn = rows.reduce((s, r) => s + r.tongBhDn, 0);

  // Column toggle UI
  const colToggleHtml = `<div class="col-toggle no-print">
    <strong style="font-size:12px">Hiển thị cột:</strong>
    ${p.visibleColumns.map(c => {
      const meta = COLUMN_META[c] || {label:c};
      return `<label><input type="checkbox" ${STATE.colVisibility[c]!==false?'checked':''} onchange="toggleCol('${c}')"> ${esc(meta.label)}</label>`;
    }).join('')}
  </div>`;

  const toolbar = `<div class="toolbar no-print">
    <div class="search-wrap"><i class="ti ti-search"></i><input type="text" placeholder="Tìm theo tên, mã, bộ phận..." value="${esc(STATE.search)}" oninput="STATE.search=this.value;render();"></div>
    <select onchange="STATE.deptFilter=this.value;render();"><option value="">Tất cả bộ phận</option>${depts.map(d=>`<option value="${esc(d)}" ${STATE.deptFilter===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <button class="tb-btn" onclick="window.print()"><i class="ti ti-printer"></i> In</button>
  </div>`;

  const summary = `<div class="g">
    <div class="cd st"><div class="lbl">Tổng NV hiển thị</div><b>${rows.length}</b></div>
    <div class="cd st"><div class="lbl">Tổng Quỹ Lương Cố Định</div><b>${vnd(totalGross)}</b></div>
    <div class="cd st"><div class="lbl">Tổng Thực Nhận (Net)</div><b>${vnd(totalNet)}</b></div>
    <div class="cd st"><div class="lbl">Tổng BH &amp; KPCĐ Doanh Nghiệp</div><b>${vnd(totalBhDn)}</b></div>
  </div>`;

  const thead = `<thead><tr>` + visible.map(c => {
    const meta = COLUMN_META[c] || {label:c};
    return `<th class="${meta.num?'num':''}">${esc(meta.label)}</th>`;
  }).join('') + `</tr></thead>`;

  const tbody = `<tbody>` + rows.map(r => {
    const errs = validateRow(r, p);
    const rowClass = errs.length ? ' style="background:var(--no-soft)"' : '';
    return `<tr${rowClass}>` + visible.map(c => {
      const meta = COLUMN_META[c] || {label:c};
      let val = r[c];
      if (val == null) val = profileSpecificValue(r, c, p);
      if (meta.fmt) val = meta.fmt(val);
      else if (meta.num) val = vnd(val);
      const style = [];
      if (meta.num) style.push('text-align:right');
      if (meta.bold) style.push('font-weight:700');
      if (meta.color==='ok') style.push('color:var(--ok)');
      if (meta.color==='ac') style.push('color:var(--ac)');
      if (meta.neg && typeof r[c]==='number' && r[c]>0) val = '-' + val;
      if (meta.tag) {
        const ok = !errs.length || (c==='checkCp' && !errs.filter(e=>!e.includes('AnCa')).length) || (c==='checkAnCa' && !errs.filter(e=>e.includes('AnCa')).length);
        return `<td><span class="tag ${ok?'tag-green':'tag-red'}">${ok?'OK':'LỖI'}</span></td>`;
      }
      return `<td class="${meta.num?'num':''}" style="${style.join(';')}" title="${errs.join(', ')}">${esc(val)}</td>`;
    }).join('') + `</tr>`;
  }).join('') + `</tbody>`;

  return toolbar + colToggleHtml + summary + `<div class="tw"><table>${thead}${tbody}</table></div>`;
}

function profileSpecificValue(r, col, profile) {
  if (col==='heSo') return profile.stateScale ? '4.40' : '-';
  if (col==='luongCoSo') return profile.stateScale ? '2.340.000 ₫' : '-';
  if (col==='esop') return profile.hasESOP ? '0' : '-';
  if (col==='stockOption') return profile.hasESOP ? '0' : '-';
  if (col==='quyPhucLoi') return profile.stateScale ? '0' : '-';
  if (col==='thamNien') return profile.stateScale ? '0' : '-';
  return '-';
}

  sql: () => `<div class="pg-h"><h1>SQL Database Blueprint</h1><p>Thiết kế cơ sở dữ liệu cho hệ thống lương đa loại hình</p></div>
    <div class="cd">
      <div class="sec-title">Sơ đồ thực thể chính</div>
      <div class="code-block">-- Bảng loại hình doanh nghiệp (Company Profiles)
CREATE TABLE company_profiles (
    profile_code VARCHAR(20) PRIMARY KEY,  -- 'fdi', 'state', 'private', 'startup'
    profile_name NVARCHAR(100),
    has_union BIT,
    has_esop BIT,
    salary_type VARCHAR(20),               -- 'market', 'state_scale'
    insurance_cap_multiplier DECIMAL(4,1),
    min_wage_region INT,
    created_at DATETIME DEFAULT GETDATE()
);

-- Bảng nhân viên
CREATE TABLE employees (
    employee_id VARCHAR(20) PRIMARY KEY,
    full_name NVARCHAR(100),
    department NVARCHAR(50),
    position NVARCHAR(50),
    profile_code VARCHAR(20) REFERENCES company_profiles(profile_code),
    base_salary DECIMAL(18,0),
    coefficient DECIMAL(4,2),              -- Dùng cho DNNN
    status NVARCHAR(30),
    join_date DATE
);

-- Bảng phương án lương (Salary Structure)
CREATE TABLE salary_structures (
    structure_id INT PRIMARY KEY IDENTITY,
    profile_code VARCHAR(20) REFERENCES company_profiles(profile_code),
    component_code VARCHAR(30),            -- 'lcb', 'pcCv', 'kpi', 'esop'...
    component_name NVARCHAR(100),
    formula_text NVARCHAR(500),
    is_visible BIT DEFAULT 1,
    is_mandatory BIT DEFAULT 0
);

-- Bảng bảng lương chi tiết (Payroll Lines)
CREATE TABLE payroll_lines (
    payroll_id INT PRIMARY KEY IDENTITY,
    employee_id VARCHAR(20) REFERENCES employees(employee_id),
    payroll_month INT,
    payroll_year INT,
    standard_days DECIMAL(4,1),
    actual_days DECIMAL(4,1),
    base_salary DECIMAL(18,0),
    gross_fixed DECIMAL(18,0),
    gross_variable DECIMAL(18,0),
    bhxh_nld DECIMAL(18,0),
    bhyt_nld DECIMAL(18,0),
    bhtn_nld DECIMAL(18,0),
    tax_tncn DECIMAL(18,0),
    net_pay DECIMAL(18,0),
    employer_cost DECIMAL(18,0),
    validation_status NVARCHAR(10),
    created_at DATETIME DEFAULT GETDATE()
);

-- Bảng audit log
CREATE TABLE audit_logs (
    log_id BIGINT PRIMARY KEY IDENTITY,
    user_id VARCHAR(50),
    action NVARCHAR(50),
    table_name VARCHAR(50),
    record_id VARCHAR(50),
    old_value NVARCHAR(MAX),
    new_value NVARCHAR(MAX),
    action_time DATETIME DEFAULT GETDATE()
);

-- View RLS: chỉ hiển thị nhân viên cùng phòng (ví dụ SQL Server)
CREATE VIEW vw_payroll_rls AS
SELECT p.* FROM payroll_lines p
JOIN employees e ON p.employee_id = e.employee_id
WHERE e.department = (SELECT department FROM employees WHERE employee_id = CURRENT_USER_ID());
</div>
      <div class="sec-title">Lưu ý thiết kế</div>
      <ul style="line-height:2">
        <li>Tách <strong>master data</strong> (nhân viên, phương án lương) khỏi <strong>transaction data</strong> (bảng lương từng tháng).</li>
        <li>Lưu công thức dưới dạng text để dễ điều chỉnh theo loại hình doanh nghiệp mà không cần sửa code.</li>
        <li>Dùng <strong>JSON column</strong> (nếu DB hỗ trợ) để lưu các phụ cấp động không cố định cột.</li>
        <li>Index trên (employee_id, payroll_month, payroll_year) để truy vấn nhanh.</li>
      </ul>
    </div>`
};
