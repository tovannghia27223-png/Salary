<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Portal — Adaptive Payroll Engine for All Enterprise Types</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
#ap-root{font:14px/1.5 Arial,sans-serif;color:#18324f}
#ap-launch{position:fixed;right:22px;bottom:22px;z-index:99990;border:0;border-radius:14px;background:#1769aa;color:white;padding:13px 18px;font-weight:700;box-shadow:0 5px 22px #173b5c35;cursor:pointer}
#ap-overlay{display:none;position:fixed;inset:0;z-index:99991;background:#f3f7fc;overflow:auto}
#ap-root *{box-sizing:border-box}
#ap-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #dce6f1;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#ap-head h2{margin:0;color:#174b7c;font-size:20px}
#ap-close{border:0;background:#eaf2fa;border-radius:9px;padding:9px 13px;cursor:pointer}
.ap-wrap{max-width:1500px;margin:auto;padding:20px}
.ap-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ap-nav button,.ap-btn{border:1px solid #cbdced;background:#fff;color:#245477;padding:9px 13px;border-radius:9px;cursor:pointer}
.ap-nav button.active,.ap-btn.primary{background:#1769aa;color:white;border-color:#1769aa}
.ap-card{background:white;border:1px solid #dce6f1;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 3px 12px #18324f08}
.ap-card h3{margin:0 0 12px;color:#205783}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.ap-field label{display:block;font-size:12px;color:#61788f;margin-bottom:4px}
.ap-field input,.ap-field select,.ap-field textarea{width:100%;padding:9px;border:1px solid #cbd9e7;border-radius:8px;background:#fff;color:#18324f}
.ap-field textarea{min-height:70px}
.ap-table-wrap{overflow:auto;max-width:100%;border:1px solid #e0e8f0;border-radius:9px}
.ap-table{border-collapse:collapse;width:100%;min-width:900px;font-size:12px}
.ap-table th,.ap-table td{padding:9px 10px;border-bottom:1px solid #e8eef5;text-align:left;white-space:nowrap}
.ap-table th{background:#edf4fb;color:#285779;position:sticky;top:0}
.ap-table input,.ap-table select{width:100%;min-width:85px;padding:6px;border:1px solid #d4e0ec;border-radius:6px}
.ap-muted{color:#70859a;font-size:12px}
.ap-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ap-kpi{background:#edf5fc;padding:14px;border-radius:11px}
.ap-kpi small{color:#637c94;display:block}
.ap-kpi strong{font-size:20px;color:#155c93}
.ap-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ap-danger{color:#a33;border-color:#e8caca}
.ap-tag{display:inline-block;padding:3px 7px;background:#edf5fc;border-radius:6px;color:#28618d;font-size:11px}
@media(max-width:650px){.ap-wrap{padding:10px}#ap-head{padding:12px}.ap-card{padding:12px}}
</style>

<div id="ap-root">
<button id="ap-launch" onclick="AP.open()">Payroll Engine</button>
<div id="ap-overlay">
 <header id="ap-head">
  <div><h2>HR PORTAL · PAYROLL ENGINE</h2><div class="ap-muted">Compensation Management · Salary Structure · Payroll Calculation</div></div>
  <button id="ap-close" onclick="AP.close()">Đóng ✕</button>
 </header>
 <main class="ap-wrap">
  <div class="ap-card">
   <div class="ap-grid">
    <div class="ap-field"><label>Doanh nghiệp đang làm việc</label><select id="ap-company" onchange="AP.switchCompany()"></select></div>
    <div class="ap-field"><label>Kỳ lương</label><input id="ap-period" type="month"></div>
    <div class="ap-field"><label>Ngày tính lương</label><input id="ap-date" type="date"></div>
   </div>
  </div>
  <nav class="ap-nav">
   <button data-tab="overview" class="active" onclick="AP.tab('overview')">Tổng quan</button>
   <button data-tab="company" onclick="AP.tab('company')">Doanh nghiệp</button>
   <button data-tab="structure" onclick="AP.tab('structure')">Cấu trúc & thang lương</button>
   <button data-tab="policy" onclick="AP.tab('policy')">Quy chế lương</button>
   <button data-tab="employees" onclick="AP.tab('employees')">Dữ liệu nhân viên</button>
   <button data-tab="engine" onclick="AP.tab('engine')">Payroll Engine</button>
   <button data-tab="settings" onclick="AP.tab('settings')">Tham số tính lương</button>
  </nav>
  <section id="ap-content"></section>
 </main>
</div>
</div>

<script>
(function(){
"use strict";
const KEY="HRPORTAL_ADAPTIVE_PAYROLL_V1";
const money=n=>new Intl.NumberFormat("vi-VN",{maximumFractionDigits:0}).format(Number(n)||0);
const num=v=>Number(v)||0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=new Date().toISOString().slice(0,10);
const defaultCompany=()=>({
 id:"company_"+Date.now(),name:"Doanh nghiệp mẫu",industry:"Khác",currency:"VND",
 grades:Array.from({length:15},(_,i)=>({code:"G"+(i+1),min:(i+1)*5000000,max:(i+1)*7000000})),
 settings:{
  standardDays:26,siRate:8,hiRate:1.5,uiRate:1,
  employerSi:17.5,employerHi:3,employerUi:1,accident:0.5,union:2,
  siHiCap:20,uiCap:20,personalDeduction:15500000,
  dependentDeduction:6200000,
  pitBrackets:[
   {limit:10000000,rate:5},
   {limit:30000000,rate:10},
   {limit:60000000,rate:20},
   {limit:100000000,rate:30},
   {limit:null,rate:35}
  ]
 },
 components:[
  {code:"BASE",name:"Lương theo hợp đồng",type:"fixed",method:"monthly",amount:10000000,taxable:true,insurance:true,active:true,policy:"Theo hợp đồng lao động"},
  {code:"POSITION",name:"Phụ cấp chức vụ",type:"fixed",method:"monthly",amount:1000000,taxable:true,insurance:true,active:true,policy:"Theo quyết định bổ nhiệm"},
  {code:"RESP",name:"Phụ cấp trách nhiệm",type:"fixed",method:"monthly",amount:500000,taxable:true,insurance:true,active:true,policy:"Theo trách nhiệm được giao"},
  {code:"MEAL",name:"Hỗ trợ ăn ca",type:"benefit",method:"monthly",amount:730000,taxable:false,insurance:false,active:true,policy:"Theo quy chế phúc lợi; cần xác minh điều kiện miễn thuế"},
  {code:"PHONE",name:"Hỗ trợ điện thoại",type:"benefit",method:"monthly",amount:300000,taxable:false,insurance:false,active:true,policy:"Theo quy chế và chứng từ"},
  {code:"FUEL",name:"Hỗ trợ xăng xe",type:"benefit",method:"monthly",amount:300000,taxable:true,insurance:false,active:true,policy:"Theo quy chế công ty"},
  {code:"ATTEND",name:"Thưởng chuyên cần",type:"variable",method:"attendance",amount:500000,taxable:true,insurance:false,active:true,policy:"Đủ điều kiện ngày công theo quy chế"},
  {code:"KPI",name:"Thưởng KPI",type:"variable",method:"manual",amount:0,taxable:true,insurance:false,active:true,policy:"Theo kết quả đánh giá KPI"},
  {code:"PRODUCT",name:"Lương sản phẩm",type:"variable",method:"manual",amount:0,taxable:true,insurance:false,active:true,policy:"Theo sản lượng nghiệm thu"},
  {code:"SALES",name:"Thưởng doanh số",type:"variable",method:"manual",amount:0,taxable:true,insurance:false,active:true,policy:"Theo chính sách kinh doanh"},
  {code:"NIGHT",name:"Tiền làm đêm",type:"variable",method:"manual",amount:0,taxable:true,insurance:false,active:true,policy:"Theo giờ làm đêm đã xác nhận"},
  {code:"OT",name:"Tiền tăng ca",type:"variable",method:"manual",amount:0,taxable:true,insurance:false,active:true,policy:"Theo giờ tăng ca và loại ngày"},
  {code:"OTHER_TAX",name:"Khoản thu nhập khác chịu thuế",type:"variable",method:"manual",amount:0,taxable:true,insurance:false,active:true,policy:"Theo chứng từ và quy chế"},
  {code:"OTHER_EXEMPT",name:"Khoản thu nhập khác miễn thuế",type:"benefit",method:"manual",amount:0,taxable:false,insurance:false,active:true,policy:"Chỉ miễn thuế khi đủ điều kiện pháp luật"},
  {code:"DEDUCT",name:"Khấu trừ khác",type:"deduction",method:"manual",amount:0,taxable:false,insurance:false,active:true,policy:"Phải có căn cứ khấu trừ hợp lệ"}
 ],
 employees:[{
  code:"NV001",name:"Nguyễn Văn A",department:"Nhân sự",title:"Chuyên viên HR",
  grade:"G3",status:"active",standardDays:26,paidDays:26,
  dependents:1,nightHours:0,otHours:0,
  attendanceBonus:500000,kpi:1000000,product:0,sales:0,
  otherTax:0,otherExempt:0,meal:730000,fuel:300000,phone:300000,
  deduction:0,insuranceBase:10000000
 }]
});

let db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db||!Array.isArray(db.companies))db={companies:[defaultCompany()],active:null};
if(!db.active)db.active=db.companies[0].id;
let results=[];
const current=()=>db.companies.find(c=>c.id===db.active)||db.companies[0];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const val=id=>document.getElementById(id)?.value??"";
const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v};
const field=(label,id,value,type="text")=>`<div class="ap-field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value??"")}"></div>`;
const btn=(label,fn,cls="ap-btn")=>`<button class="${cls}" onclick="${fn}">${label}</button>`;
const table=(heads,rows)=>`<div class="ap-table-wrap"><table class="ap-table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
function companyOptions(){
 const s=document.getElementById("ap-company");if(!s)return;
 s.innerHTML=db.companies.map(c=>`<option value="${esc(c.id)}" ${c.id===db.active?"selected":""}>${esc(c.name)}</option>`).join("");
}
function render(){
 companyOptions();
 const c=current();if(!c)return;
 const tab=document.querySelector("#ap-overlay .ap-nav button.active")?.dataset.tab||"overview";
 const root=document.getElementById("ap-content");
 const views={overview,company,structure,policy,employees,engine,settings};
 root.innerHTML=views[tab]();
}
function overview(){
 const c=current();const total=c.employees.length;
 return `<div class="ap-card"><h3>Tổng quan kỳ lương</h3>
 <div class="ap-kpis">
 <div class="ap-kpi"><small>Doanh nghiệp</small><strong>${esc(c.name)}</strong></div>
 <div class="ap-kpi"><small>Nhân viên</small><strong>${total}</strong></div>
 <div class="ap-kpi"><small>Khoản lương đang cấu hình</small><strong>${c.components.filter(x=>x.active).length}</strong></div>
 <div class="ap-kpi"><small>Nhóm thang lương</small><strong>G1–G15</strong></div>
 </div></div>
 <div class="ap-card"><h3>Luồng nghiệp vụ Payroll</h3>
 <p>1. Khai báo doanh nghiệp → 2. Xây dựng cấu trúc lương → 3. Ban hành quy chế → 4. Nhập dữ liệu nhân viên → 5. Tính lương → 6. Kiểm tra → 7. Xuất bảng lương.</p>
 <p class="ap-muted">Bản demo đang dùng dữ liệu trình duyệt. Chưa kết nối dữ liệu thật từ Supabase.</p></div>
 <div class="ap-card"><h3>Thao tác nhanh</h3><div class="ap-actions">
 ${btn("Cấu hình khoản lương","AP.tab('policy')","ap-btn primary")}
 ${btn("Thêm nhân viên","AP.tab('employees')")}
 ${btn("Tính bảng lương","AP.tab('engine')")}
 </div></div>`;
}
function company(){
 const c=current();
 return `<div class="ap-card"><h3>Thông tin doanh nghiệp</h3><div class="ap-grid">
 ${field("Tên doanh nghiệp","co-name",c.name)}
 ${field("Ngành nghề","co-industry",c.industry)}
 </div><div class="ap-actions">
 ${btn("Lưu thông tin","AP.saveCompany()","ap-btn primary")}
 ${btn("Tạo doanh nghiệp mới","AP.addCompany()")}
 ${btn("Nhân bản cấu hình hiện tại","AP.cloneCompany()")}
 ${btn("Xóa doanh nghiệp này","AP.deleteCompany()","ap-btn ap-danger")}
 </div></div>
 <div class="ap-card"><h3>Nguyên tắc quản trị nhiều doanh nghiệp</h3>
 <p>Mỗi doanh nghiệp có bộ cấu trúc lương, quy chế, thang lương, tham số tính toán và nhân viên độc lập.</p>
 <p class="ap-muted">Không tự động chia sẻ dữ liệu lương giữa các doanh nghiệp.</p></div>`;
}
function structure(){
 const c=current();
 const rows=c.grades.map((g,i)=>`<tr>
 <td>${g.code}</td><td><input id="gr-min-${i}" type="number" value="${g.min}"></td>
 <td><input id="gr-max-${i}" type="number" value="${g.max}"></td>
 <td><span class="ap-tag">Job Grade</span></td></tr>`).join("");
 return `<div class="ap-card"><h3>Salary Structure Builder</h3>
 <p>Quản lý lương theo nhóm chức danh, cấp bậc, khoảng lương và cơ sở trả lương.</p>
 <div class="ap-grid">
 <div class="ap-field"><label>Cơ sở Salary Range</label><select id="sr-basis"><option>Base Salary</option><option>Gross Salary</option><option>Total Cash Compensation</option></select></div>
 <div class="ap-field"><label>Phương pháp xây dựng</label><select id="sr-method"><option>Hybrid</option><option>Fixed range</option><option>Market-based</option><option>Company-defined</option></select></div>
 <div class="ap-field"><label>Nguồn tham chiếu</label><select id="sr-source"><option>Kết hợp: lương tối thiểu vùng + thị trường + nội bộ</option><option>Thị trường</option><option>Nội bộ doanh nghiệp</option><option>Khung pháp luật</option></select></div>
 </div></div>
 <div class="ap-card"><h3>Salary Range · G1–G15</h3>
 ${table(["Job Grade","Minimum (VND)","Maximum (VND)","Phân loại"],rows)}
 <div class="ap-actions">${btn("Lưu thang lương","AP.saveGrades()","ap-btn primary")}</div>
 <p class="ap-muted">G1–G15 là khung tham chiếu ban đầu, doanh nghiệp có thể điều chỉnh khoảng lương theo chức danh và thị trường.</p></div>
 <div class="ap-card"><h3>Nguyên tắc sử dụng</h3>
 <p>Base Salary, Gross Salary và Total Cash Compensation là ba cơ sở khác nhau. Không cộng trùng phụ cấp hoặc khoản thưởng khi so sánh khoảng lương.</p></div>`;
}
function policy(){
 const c=current();
 const rows=c.components.map((x,i)=>`<tr>
 <td><input id="pc-code-${i}" value="${esc(x.code)}"></td>
 <td><input id="pc-name-${i}" value="${esc(x.name)}"></td>
 <td><select id="pc-type-${i}">${["fixed","variable","benefit","deduction","employer"].map(v=>`<option value="${v}" ${x.type===v?"selected":""}>${v}</option>`).join("")}</select></td>
 <td><select id="pc-method-${i}">${["monthly","daily","attendance","hourly","manual","percentage"].map(v=>`<option ${x.method===v?"selected":""}>${v}</option>`).join("")}</select></td>
 <td><input id="pc-amount-${i}" type="number" value="${num(x.amount)}"></td>
 <td><input id="pc-tax-${i}" type="checkbox" ${x.taxable?"checked":""}></td>
 <td><input id="pc-si-${i}" type="checkbox" ${x.insurance?"checked":""}></td>
 <td><input id="pc-active-${i}" type="checkbox" ${x.active?"checked":""}></td>
 <td><input id="pc-policy-${i}" value="${esc(x.policy)}"></td>
 </tr>`).join("");
 return `<div class="ap-card"><h3>Quy chế cho các biến lương</h3>
 <p>Mỗi khoản có thể do doanh nghiệp tự thiết lập. Quy chế phải mô tả đối tượng hưởng, điều kiện, cách tính, thời điểm trả và cách xử lý khi nghỉ việc hoặc không đủ công.</p>
 ${table(["Mã","Tên khoản","Nhóm","Phương pháp","Giá trị mặc định","Chịu PIT","Tính BHXH","Đang dùng","Quy chế/điều kiện"],rows)}
 <div class="ap-actions">
 ${btn("Lưu toàn bộ quy chế","AP.savePolicies()","ap-btn primary")}
 ${btn("Thêm khoản lương","AP.addComponent()")}
 </div></div>
 <div class="ap-card"><h3>Phân loại khoản lương</h3>
 <p><b>Fixed:</b> khoản cố định theo thỏa thuận.</p>
 <p><b>Variable:</b> khoản biến động như KPI, doanh số, sản phẩm, tăng ca.</p>
 <p><b>Benefit:</b> khoản phúc lợi hoặc hỗ trợ.</p>
 <p><b>Deduction:</b> khoản khấu trừ có căn cứ.</p>
 <p><b>Employer:</b> khoản chi phí thuộc trách nhiệm doanh nghiệp.</p>
 <p class="ap-muted">Cờ chịu thuế và tính BHXH là cấu hình nghiệp vụ. Cần xác định theo bản chất khoản chi và quy định pháp luật hiện hành, không chỉ dựa vào tên khoản.</p></div>`;
}
function employees(){
 const c=current();
 const rows=c.employees.map((e,i)=>`<tr>
 <td><input id="e-code-${i}" value="${esc(e.code)}"></td>
 <td><input id="e-name-${i}" value="${esc(e.name)}"></td>
 <td><input id="e-dept-${i}" value="${esc(e.department)}"></td>
 <td><input id="e-title-${i}" value="${esc(e.title)}"></td>
 <td><select id="e-grade-${i}">${c.grades.map(g=>`<option ${e.grade===g.code?"selected":""}>${g.code}</option>`).join("")}</select></td>
 <td><input id="e-standard-${i}" type="number" value="${e.standardDays}"></td>
 <td><input id="e-paid-${i}" type="number" value="${e.paidDays}"></td>
 <td><input id="e-base-${i}" type="number" value="${e.insuranceBase}"></td>
 <td><input id="e-dep-${i}" type="number" value="${e.dependents}"></td>
 <td><select id="e-status-${i}"><option value="active" ${e.status==="active"?"selected":""}>Đang làm</option><option value="inactive" ${e.status==="inactive"?"selected":""}>Nghỉ</option></select></td>
 </tr>`).join("");
 return `<div class="ap-card"><h3>Dữ liệu đầu vào nhân viên</h3>
 ${table(["Mã NV","Họ tên","Phòng ban","Chức danh","Grade","Công chuẩn","Công hưởng lương","Lương đóng BH","Số NPT","Trạng thái"],rows)}
 <div class="ap-actions">${btn("Lưu nhân viên","AP.saveEmployees()","ap-btn primary")}${btn("Thêm nhân viên","AP.addEmployee()")}</div></div>
 <div class="ap-card"><h3>Dữ liệu biến động kỳ lương</h3>
 <p>Thưởng KPI, thưởng doanh số, lương sản phẩm, tăng ca, giờ đêm, hỗ trợ và khấu trừ được nhập trong hồ sơ nhân viên hoặc cập nhật tại bảng dữ liệu kỳ lương.</p></div>`;
}
function settings(){
 const s=current().settings;
 return `<div class="ap-card"><h3>Tham số bảo hiểm và thuế</h3>
 <p class="ap-muted">Các tham số dưới đây là giá trị khởi tạo để chạy thử. HR/Admin phải đối chiếu văn bản pháp luật và cấu hình ngày hiệu lực trước khi dùng chính thức.</p>
 <div class="ap-grid">
 ${field("Ngày công chuẩn/tháng","s-days",s.standardDays)}
 ${field("NLĐ BHXH (%)","s-si",s.siRate)}
 ${field("NLĐ BHYT (%)","s-hi",s.hiRate)}
 ${field("NLĐ BHTN (%)","s-ui",s.uiRate)}
 ${field("DN BHXH (%)","s-esi",s.employerSi)}
 ${field("DN BHYT (%)","s-ehi",s.employerHi)}
 ${field("DN BHTN (%)","s-eui",s.employerUi)}
 ${field("Tai nạn lao động (%)","s-acc",s.accident)}
 ${field("Kinh phí công đoàn (%)","s-union",s.union)}
 ${field("Trần BHXH/BHYT (bội số tham chiếu)","s-sicap",s.siHiCap)}
 ${field("Trần BHTN (bội số tham chiếu)","s-uicap",s.uiCap)}
 ${field("Giảm trừ bản thân","s-personal",s.personalDeduction)}
 ${field("Giảm trừ mỗi người phụ thuộc","s-dependent",s.dependentDeduction)}
 </div>
 <div class="ap-actions">${btn("Lưu tham số","AP.saveSettings()","ap-btn primary")}</div></div>
 <div class="ap-card"><h3>Biểu thuế lũy tiến</h3>
 <p class="ap-muted">Cấu hình ngưỡng thu nhập tháng và thuế suất. Ngưỡng cuối cùng để trống nghĩa là không giới hạn.</p>
 ${table(["Ngưỡng thu nhập đến (VND)","Thuế suất (%)"],s.pitBrackets.map((b,i)=>`<tr><td><input id="pit-limit-${i}" type="number" value="${b.limit??""}" placeholder="Không giới hạn"></td><td><input id="pit-rate-${i}" type="number" value="${b.rate}"></td></tr>`).join(""))}
 <div class="ap-actions">${btn("Lưu biểu thuế","AP.saveTax()","ap-btn primary")}</div></div>`;
}
function progressiveTax(taxable,brackets){
 let tax=0,lower=0,left=Math.max(0,taxable);
 for(const b of brackets){
  if(left<=0)break;
  const width=b.limit==null?left:Math.max(0,Math.min(left,b.limit-lower));
  tax+=width*b.rate/100;left-=width;
  if(b.limit!=null)lower=b.limit;
 }
 return Math.max(0,tax);
}
function calculate(e,c){
 const s=c.settings,standard=Math.max(1,num(e.standardDays)||s.standardDays);
 const paid=Math.max(0,num(e.paidDays));
 const ratio=Math.min(1.5,paid/standard);
 const comps=c.components.filter(x=>x.active);
 const get=(code)=>comps.find(x=>x.code===code);
 const base=num(get("BASE")?.amount);
 const position=num(get("POSITION")?.amount);
 const responsibility=num(get("RESP")?.amount);
 const otherFixed=num(get("OTHER_FIXED")?.amount);
 const fixed=base+position+responsibility+otherFixed;
 const prorated=fixed*ratio;
 const attendance=num(e.attendanceBonus);
 const kpi=num(e.kpi),product=num(e.product),sales=num(e.sales);
 const otherTax=num(e.otherTax),otherExempt=num(e.otherExempt);
 const night=num(e.nightHours),ot=num(e.otHours);
 const meal=num(e.meal),fuel=num(e.fuel),phone=num(e.phone);
 const variableTax=kpi+product+sales+otherTax;
 const totalVariable=attendance+kpi+product+sales+otherTax+otherExempt;
 const insuranceBase=Math.max(0,num(e.insuranceBase)||fixed);
 const siCap=s.siHiCap*2530000;
 const uiCap=s.uiCap*2530000;
 const siBase=Math.min(insuranceBase,siCap);
 const uiBase=Math.min(insuranceBase,uiCap);
 const si=siBase*s.siRate/100,hi=siBase*s.hiRate/100,ui=uiBase*s.uiRate/100;
 const empInsurance=si+hi+ui;
 const taxableIncome=prorated+variableTax+meal+fuel+phone;
 const dependentCount=Math.max(0,num(e.dependents));
 const personal=s.personalDeduction;
 const dependent=dependentCount*s.dependentDeduction;
 const pitBase=Math.max(0,taxableIncome-empInsurance-personal-dependent);
 const pit=progressiveTax(pitBase,s.pitBrackets);
 const deduction=num(e.deduction);
 const gross=prorated+totalVariable+meal+fuel+phone;
 const net=gross-empInsurance-pit-deduction;
 const esi=siBase*s.employerSi/100;
 const ehi=siBase*s.employerHi/100;
 const eui=uiBase*s.employerUi/100;
 const accident=siBase*s.accident/100;
 const union=siBase*s.union/100;
 const employerContrib=esi+ehi+eui+accident+union;
 const employerCost=gross+employerContrib;
 const fixedInsurable=comps.filter(x=>x.insurance).reduce((a,x)=>a+num(x.amount),0);
 const check=Math.abs(insuranceBase-fixedInsurable)<1? "Khớp cấu hình":"Cần đối chiếu";
 return {
  code:e.code,name:e.name,department:e.department,title:e.title,
  standard,paid,ratio,insuranceBase,position,responsibility,otherFixed,fixed,
  prorated,attendance,kpi,product,sales,otherTax,otherExempt,night,ot,
  si,hi,ui,empInsurance,taxableIncome,personal,dependentCount,dependent,
  pitBase,pit,net,esi,ehi,eui,accident,union,employerContrib,employerCost,
  check,meal,mealExempt:0,mealTaxable:meal,mealCheck:"Cần xác minh quy chế",
  siHiCap:siCap,uiCap, status:e.status||"active",fuel,phone,deduction
 };
}
const columns=[
 ["Mã nhân viên","code"],["Họ tên","name"],["Phòng ban","department"],["Chức danh","title"],
 ["Công chuẩn","standard"],["Công hưởng lương","paid"],["Tỷ lệ công","ratio"],
 ["Lương hợp đồng","fixed"],["Lương đóng BHXH","insuranceBase"],["Phụ cấp chức vụ","position"],
 ["Phụ cấp trách nhiệm","responsibility"],["Phụ cấp cố định khác","otherFixed"],["Tổng lương cố định","fixed"],
 ["Lương theo công","prorated"],["Thưởng chuyên cần","attendance"],["Thưởng KPI","kpi"],
 ["Lương sản phẩm","product"],["Thưởng doanh số","sales"],["Thu nhập chịu thuế khác","otherTax"],
 ["Thu nhập miễn thuế khác","otherExempt"],["Giờ làm đêm","night"],["Giờ tăng ca","ot"],
 ["NLĐ BHXH","si"],["NLĐ BHYT","hi"],["NLĐ BHTN","ui"],["Tổng BH NLĐ","empInsurance"],
 ["Tổng thu nhập tính thuế","taxableIncome"],["Giảm trừ bản thân","personal"],
 ["Số người phụ thuộc","dependentCount"],["Giảm trừ người phụ thuộc","dependent"],
 ["Thu nhập tính thuế","pitBase"],["Thuế TNCN","pit"],["Thực lĩnh","net"],
 ["DN BHXH","esi"],["DN BHYT","ehi"],["DN BHTN","eui"],["Tai nạn lao động","accident"],
 ["Kinh phí công đoàn","union"],["Tổng khoản DN đóng","employerContrib"],["Tổng chi phí DN","employerCost"],
 ["Kiểm tra chi phí","check"],["Hỗ trợ ăn ca","meal"],["Ăn ca miễn thuế","mealExempt"],
 ["Ăn ca chịu thuế","mealTaxable"],["Kiểm tra ăn ca","mealCheck"],["Trần BHXH/BHYT","siHiCap"],
 ["Trần BHTN","uiCap"],["Trạng thái nhân viên","status"],["Hỗ trợ xăng xe","fuel"],["Hỗ trợ điện thoại","phone"],
 ["Khoản khấu trừ khác","deduction"]
];
function engine(){
 const c=current();
 results=c.employees.filter(e=>e.status!=="inactive").map(e=>calculate(e,c));
 const sum=k=>results.reduce((a,r)=>a+num(r[k]),0);
 const rows=results.map(r=>`<tr>${columns.map(([label,key])=>`<td>${typeof r[key]==="number"?money(r[key]):esc(r[key])}</td>`).join("")}</tr>`).join("");
 return `<div class="ap-card"><h3>Payroll Engine · Bảng lương ${esc(val("ap-period"))}</h3>
 <div class="ap-kpis">
 <div class="ap-kpi"><small>Tổng nhân viên</small><strong>${results.length}</strong></div>
 <div class="ap-kpi"><small>Tổng thực lĩnh</small><strong>${money(sum("net"))}</strong></div>
 <div class="ap-kpi"><small>Tổng chi phí DN</small><strong>${money(sum("employerCost"))}</strong></div>
 <div class="ap-kpi"><small>Tổng thuế TNCN</small><strong>${money(sum("pit"))}</strong></div>
 </div>
 <div class="ap-actions">
 ${btn("Tính lại bảng lương","AP.calculate()","ap-btn primary")}
 ${btn("Xuất CSV 51+ cột","AP.exportCSV()")}
 </div>
 <p class="ap-muted">Bảng kết quả được tính từ dữ liệu hiện tại của doanh nghiệp đang chọn. Cần kiểm tra quy chế, dữ liệu công, căn cứ bảo hiểm và thuế trước khi khóa kỳ.</p></div>
 <div class="ap-card"><h3>Chi tiết kết quả</h3>${table(columns.map(x=>x[0]),rows)}</div>`;
}
function download(name,content,type){
 const blob=new Blob([content],{type:type||"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");
 a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}

 saveSettings(){const s=current().settings;Object.assign(s,{standardDays:num(val("s-days")),siRate:num(val("s-si")),hiRate:num(val("s-hi")),uiRate:num(val("s-ui")),employerSi:num(val("s-esi")),employerHi:num(val("s-ehi")),employerUi:num(val("s-eui")),accident:num(val("s-acc")),union:num(val("s-union")),siHiCap:num(val("s-sicap")),uiCap:num(val("s-uicap")),personalDeduction:num(val("s-personal")),dependentDeduction:num(val("s-dependent"))});save();alert("Đã lưu tham số.")},
 saveTax(){const s=current().settings;s.pitBrackets=s.pitBrackets.map((b,i)=>({limit:val("pit-limit-"+i)===""?null:num(val("pit-limit-"+i)),rate:num(val("pit-rate-"+i))}));save();alert("Đã lưu biểu thuế.")},
 calculate(){const c=current();results=c.employees.filter(e=>e.status!=="inactive").map(e=>calculate(e,c));this.tab("engine")},
